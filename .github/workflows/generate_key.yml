name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore and Base64
        run: |
          keytool -genkeypair -v -keystore appdony.keystore -alias appdony -keyalg RSA -keysize 2048 -validity 10000 -storepass appdony123 -keypass appdony123 -dname "CN=Appdony, OU=Dev, O=Appdony, L=Tehran, S=Tehran, C=IR"
          base64 appdony.keystore > keystore_base64.txt

      - name: Upload Base64 File
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
