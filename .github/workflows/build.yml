name: Build Secure Release APK

# 👇 ۱. جلوگیری از اجرای همزمان چند بیلد (هر بیلد جدید، قبلی رو کنسل می‌کنه)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 👇 ۲. اصل حداقل دسترسی (Principle of Least Privilege)
# این توکن فقط اجازه خوندن کدها رو داره، نه پاک کردن یا تغییر دادنشون
permissions:
  contents: read

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    # 👇 ۳. جلوگیری از هدر رفتن اعتبار در صورت هنگ کردن
    timeout-minutes: 15

    steps:
      # 👇 ۴. استفاده از نسخه‌های پین‌شده اکشن‌ها (جلوگیری از آپدیت‌های ناخواسته)
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # کش کردن فایل‌های جاوا برای سرعت بیشتر

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.1.0

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # 👇 ۵. امنیت فایل کلید (Keystore)
      - name: Decode and Secure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # تنظیم سطح دسترسی فایل به‌گونه‌ای که فقط کاربر جاری بتونه بخونتش
          umask 077 
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded securely."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 👇 ۶. پاک کردن فایل حساس کلید بعد از اتمام بیلد
      - name: Cleanup Keystore
        if: always() # این مرحله حتی اگه بیلد fail بشه هم اجرا میشه
        run: rm -f app/release.keystore

      # 👇 ۷. آپلود فایل نهایی با تنظیم زمان نگهداری
      - name: Upload Release APK
        uses: actions/upload-artifact@v4.1.0
        with:
          name: appdony-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14 # فایل رو فقط ۱۴ روز نگه دار
          if-no-files-found: error # اگه فایل APK ساخته نشد، ارور بده
