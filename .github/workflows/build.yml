name: Build & Release APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Decode and Secure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded securely."

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-log.txt

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload Build Logs and R8 Reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-logs
          path: |
            build-log.txt
            app/build/outputs/mapping/release/**
          retention-days: 14
          if-no-files-found: warn

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: "نسخه جدید اپدونی با آخرین تغییرات و بهینه‌سازی‌ها."
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: appdony-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

  crash-test:
    name: Run APK on Emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: appdony-release-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare log folder
        run: mkdir -p crash-logs

      - name: Install, launch and capture logs
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb install -r apk/app-release.apk
            adb shell am start -W -n com.appdony.app/.MainActivity
            sleep 30
            adb logcat -d > crash-logs/logcat_full.txt
            adb logcat -d -b crash > crash-logs/logcat_crash.txt
            adb shell dumpsys activity exit-info com.appdony.app > crash-logs/exit-info.txt
            adb shell pidof com.appdony.app > crash-logs/pid.txt || true
            adb exec-out screencap -p > crash-logs/screenshot.png

      - name: Upload Crash Logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: crash-logs
          path: crash-logs/**
          retention-days: 14
          if-no-files-found: warn
