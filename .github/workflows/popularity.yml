name: Update Popularity

on:
  schedule:
    - cron: "17 3 * * *"   # هر روز ساعت ۰۳:۱۷ UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: popularity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build popularity.json
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: python scripts/build_popularity.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popularity.json scripts/rawg_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update popularity data"
            git pull --rebase
            git push
          fi
