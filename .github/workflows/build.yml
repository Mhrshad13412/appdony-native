name: Build & Release APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Decode and Secure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded securely."

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_KEY: ${{ secrets.AI_KEY }}
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-log.txt
          mkdir -p dist dist-mapping
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp -r app/build/outputs/mapping/release/. dist-mapping/ || true

      # APK جدا فقط برای امولاتور (x86_64 هم داخلشه)؛ ریلیز واقعی همون APK بالاست
      - name: Build Emulator APK
        shell: bash
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_KEY: ${{ secrets.AI_KEY }}
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PemuAbi=1 --stacktrace 2>&1 | tee build-log-emu.txt
          mkdir -p dist-emu
          cp app/build/outputs/apk/release/app-release.apk dist-emu/app-release-emu.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload Build Logs and R8 Reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-logs
          path: |
            build-log.txt
            build-log-emu.txt
            dist-mapping/**
          retention-days: 14
          if-no-files-found: warn

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: "نسخه جدید اپدونی با آخرین تغییرات و بهینه‌سازی‌ها."
          files: dist/app-release.apk
          draft: false
          prerelease: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: appdony-release-apk
          path: dist/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Emulator APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: appdony-emulator-apk
          path: dist-emu/app-release-emu.apk
          retention-days: 3
          if-no-files-found: error

  crash-test:
    name: Run APK on Emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Download Emulator APK
        uses: actions/download-artifact@v4
        with:
          name: appdony-emulator-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare log folder
        run: mkdir -p crash-logs

      # اگه امولاتور بالا نیاد، همین‌جا ۲۲ دقیقه بعد قطع می‌شه و مرحله‌ی آپلود لاگ حتماً اجرا می‌شه
      - name: Install, launch and capture logs
        timeout-minutes: 22
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_3a
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash .github/scripts/emu-test.sh

      - name: Summary
        if: always()
        run: |
          echo "### Emulator steps" >> "$GITHUB_STEP_SUMMARY"
          if [ -f crash-logs/steps.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat crash-logs/steps.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Emulator did not boot, no logs were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s crash-logs/logcat_errors.txt ]; then
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 crash-logs/logcat_errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Crash Logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: crash-logs
          path: crash-logs/**
          retention-days: 14
          if-no-files-found: warn
