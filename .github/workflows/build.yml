name: Build & Release APK

# 👇 ۱. جلوگیری از اجرای همزمان چند بیلد (هر بیلد جدید، قبلی رو کنسل می‌کنه)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 👇 ۲. دسترسی لازم برای ساخت ریلیز در گیت‌هاب
permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    # 👇 ۳. جلوگیری از هدر رفتن اعتبار در صورت هنگ کردن
    timeout-minutes: 15

    steps:
      # 👇 ۴. استفاده از نسخه‌های پین‌شده اکشن‌ها
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # 👈 کش کردن فایل‌های جاوا برای سرعت بیشتر

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.1.0

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # 👇 ۵. امنیت فایل کلید (Keystore)
      - name: Decode and Secure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077 
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded securely."

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 👇 ۶. پاک کردن فایل حساس کلید بعد از اتمام بیلد
      - name: Cleanup Keystore
        if: always() # این مرحله حتی اگه بیلد fail بشه هم اجرا میشه
        run: rm -f app/release.keystore

      # 👇 ۷. استخراج خودکار نسخه از فایل build.gradle.kts
      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 👇 ۸. ساخت ریلیز جدید در گیت‌هاب (برای آپدیت خودکار اپ)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: "نسخه جدید اپدونی با آخرین تغییرات و بهینه‌سازی‌ها."
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false

      # 👇 ۹. آپلود فایل APK به عنوان بک‌آپ در تب Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: appdony-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14 # فایل رو فقط ۱۴ روز نگه دار
          if-no-files-found: error
